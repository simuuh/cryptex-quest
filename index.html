<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12151F" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Cryptex Quest</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <script src="js/file-protocol-hint.js"></script>
    <script type="module" src="js/pages/index.js"></script>
  </head>
  <body>
    <main id="app" class="cq-page">
      <div id="view" class="cq-view" hidden>
        <header class="cq-header">
          <p class="cq-eyebrow" data-i18n="app.name"></p>
          <h1 class="cq-title" id="headline"></h1>
          <p class="cq-lead" id="intro"></p>
        </header>

        <section class="cq-card" aria-labelledby="code-heading">
          <h2 class="cq-section-title" id="code-heading" data-i18n="index.codeLabel"></h2>
          <ol class="cq-slots" id="slots"></ol>
        </section>

        <section aria-labelledby="puzzles-heading">
          <h2 class="cq-section-title" id="puzzles-heading" data-i18n="index.puzzlesHeading"></h2>
          <ol class="cq-list" id="puzzle-list"></ol>
        </section>

        <div id="progress" aria-live="polite"></div>
        <p class="cq-note" id="storage-warning" data-i18n="index.storageWarning" hidden></p>
      </div>
    <noscript><p class="cq-card">This page needs JavaScript. / Diese Seite braucht JavaScript.</p></noscript>
    </main>
  </body>
</html>
